# Release on version tags: `git tag v1.2.3 && git push origin v1.2.3`
#
#   1. test     - format check, warnings-as-errors compile, test suite
#   2. build    - single-file binaries (linux amd64/arm64, burrito_ng) and a
#                 multi-arch distroless image pushed to ghcr.io/<owner>/<repo>
#   3. release  - GitHub release with the binaries and SHA256SUMS
#
# Tags with a pre-release suffix (v1.2.3-rc.1) create a pre-release and do not
# move the `latest` image tag. Actions are pinned to commit SHAs.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag is a semantic version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi

      - name: Install Erlang build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf m4 libncurses-dev libssl-dev

      # Erlang/Elixir as pinned in mise.toml (cached after the first run).
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: erlang elixir

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The builder stage runs natively on the runner; burrito_ng cross-builds
      # the arm64 binary, so no QEMU is needed.
      - name: Build binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=vulsweb
          cache-to: type=gha,mode=max,scope=vulsweb

      - name: Name binaries and write checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            install -m 0755 "dist/linux_${arch}/vulsweb" "release/vulsweb_${VERSION}_linux_${arch}"
          done
          cd release
          sha256sum vulsweb_* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: release/
          if-no-files-found: error

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=vulsweb
            org.opencontainers.image.description=A web UI for vuls vulnerability scan results
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.vendor=MUDROCK SOFTWARE LTD

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=vulsweb

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"

          cat > notes.md <<EOF
          ## Install

          Single-file binary (Linux, no dependencies):

          \`\`\`sh
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/vulsweb_${VERSION}_linux_amd64
          chmod +x vulsweb_${VERSION}_linux_amd64
          VULS_RESULTS_DIR=/path/to/vuls/results ./vulsweb_${VERSION}_linux_amd64
          \`\`\`

          Container image (linux/amd64, linux/arm64):

          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "vulsweb ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease \
            release/*
